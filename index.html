<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Shine`s ToDo APP</h1>
        <button id="theme-toggle" class="theme-btn">Toggle Dark Mode</button>
    </header>

    <div class="layout-container">
        <main>
            <section class="todo-list-container">
                <h2>Task List</h2>
                <ul class="todo-list" id="todo-list">
                </ul>
            </section>
        </main>

        <aside>
            <section class="todo-detail-container">
                <h2>Task Details</h2>
                <div class="detail-card" id="detail-card">
                    <h3>Pilih task buat lihat detailnya</h3>
                    <p class="status"><strong>Status:</strong> -</p>
                    <p class="due-date"><strong>Due:</strong> -</p>
                    <p class="description">Deskripsi akan muncul di sini.</p>
                </div>
            </section>
            
            <section class="todo-form-container">
                <h2>Create New Task</h2>
                <form>
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" placeholder="Enter task title...">
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" placeholder="Enter task details..."></textarea>
                    </div>
                    <button type="button" id="add-btn">Add Todo</button>
                </form>
            </section>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 The Style Warrior - Todo List</p>
    </footer>
    <script src="script.js"></script>
